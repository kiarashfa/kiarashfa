<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="A molecule as a graph neural network with messages passing along its bonds">
  <defs>
    <filter id="c2-soft" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="c2-node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#848d97" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#848d97" stop-opacity="0.08"/>
    </radialGradient>
    <!-- atom node: haloed circle that pulses like a neuron -->
    <g id="c2-atom">
      <circle r="12" fill="none" stroke="#79c0ff" stroke-width="1.1" opacity="0">
        <animate attributeName="r" values="8;17" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="7.5" fill="url(#c2-node)" stroke="#848d97" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- ═══ BONDS (graph edges) ═══ -->
  <g stroke="#848d97" stroke-width="1.8" opacity="0.6" fill="none" stroke-linecap="round">
    <!-- benzene ring -->
    <line x1="200" y1="147" x2="250" y2="176"/>
    <line x1="250" y1="176" x2="250" y2="234"/>
    <line x1="250" y1="234" x2="200" y2="263"/>
    <line x1="200" y1="263" x2="150" y2="234"/>
    <line x1="150" y1="234" x2="150" y2="176"/>
    <line x1="150" y1="176" x2="200" y2="147"/>
    <!-- substituents: —OH (top), —NH2 (lower-right), —CH3 (lower-left) -->
    <line x1="200" y1="147" x2="200" y2="113"/>
    <line x1="250" y1="234" x2="284" y2="254"/>
    <line x1="150" y1="234" x2="116" y2="254"/>
  </g>
  <!-- aromatic ring -->
  <circle cx="200" cy="205" r="33" fill="none" stroke="#848d97" stroke-width="1.4" opacity="0.4"/>

  <!-- ═══ MESSAGES passing along the edges ═══ -->
  <g filter="url(#c2-soft)">
    <!-- a message circulating the ring -->
    <circle r="2.6" fill="#79c0ff">
      <animateMotion dur="4.2s" repeatCount="indefinite"
        path="M200,147 L250,176 L250,234 L200,263 L150,234 L150,176 Z"/>
    </circle>
    <!-- messages travelling out to / in from the substituents -->
    <circle r="2.3" fill="#79c0ff" opacity="0">
      <animateMotion dur="2.4s" begin="0.2s" repeatCount="indefinite" path="M200,147 L200,113"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.3" fill="#79c0ff" opacity="0">
      <animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite" path="M284,254 L250,234"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.3" fill="#79c0ff" opacity="0">
      <animateMotion dur="2.4s" begin="1.9s" repeatCount="indefinite" path="M150,234 L116,254"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.4s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
    <!-- a diagonal message across the ring (long-range coupling) -->
    <circle r="2.1" fill="#79c0ff" opacity="0">
      <animateMotion dur="3s" begin="0.6s" repeatCount="indefinite" path="M150,176 L250,234"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ═══ ATOM NODES (neurons) ═══ -->
  <use href="#c2-atom" x="200" y="147"/>
  <use href="#c2-atom" x="250" y="176"/>
  <use href="#c2-atom" x="250" y="234"/>
  <use href="#c2-atom" x="200" y="263"/>
  <use href="#c2-atom" x="150" y="234"/>
  <use href="#c2-atom" x="150" y="176"/>
  <use href="#c2-atom" x="200" y="113"/>
  <use href="#c2-atom" x="284" y="254"/>
  <use href="#c2-atom" x="116" y="254"/>

  <!-- staggered neuron twinkle overlaid on the nodes -->
  <g fill="#79c0ff">
    <circle cx="200" cy="147" r="3"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="234" r="3"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="176" r="3"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="263" r="3"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3s" begin="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- heteroatom labels keep it reading as chemistry -->
  <g fill="#848d97" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" opacity="0.85">
    <text x="200" y="108">O</text>
    <text x="292" y="258">N</text>
  </g>

  <!-- label -->
  <text x="200" y="352" text-anchor="middle" fill="#6e7681" font-family="ui-monospace, monospace" font-size="8" letter-spacing="2.5" opacity="0.45">
    MESSAGE&#160;PASSING · MOLECULAR&#160;GRAPH
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
